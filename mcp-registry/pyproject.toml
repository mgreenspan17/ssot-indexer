[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssot-registry-mcp"
version = "1.0.0"
description = "SSOT MCP Registry Service for Personal Intelligence Layer OS"
authors = [
    {name = "Manni + Oz", email = "manni@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
ssot-registry = "server:main"

[tool.setuptools.packages.find]
exclude = ["venv*", "deploy*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
