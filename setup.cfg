[metadata]
name = ssot-indexer
version = 1.0.0
description = SSOT file indexer with canonical storage, shortcuts, and resolver support

[options]
packages = find:
include_package_data = True
python_requires = >=3.9

[options.entry_points]
console_scripts =
    ssotctl = cli.ssotctl:main

[options.packages.find]
include =
    canonical*
    classify*
    cli*
    consolidation*
    hashing*
    health*
    indexer*
    lifecycle*
    pil*
    graph*
    observability*
    orchestrator*
    resolver*
    rules*
    scanner*
    shortcuts*
    telemetry*
    t320*
    uuid*

[tool:pytest]
testpaths = tests

[flake8]
max-line-length = 100

[ruff]
line-length = 100

[mypy]
python_version = 3.9
warn_unused_configs = True
disallow_untyped_defs = True
no_implicit_optional = True
check_untyped_defs = True
ignore_missing_imports = True
