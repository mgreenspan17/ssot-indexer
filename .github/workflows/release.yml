name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Align version file
        run: python scripts/bump_version.py --set "${GITHUB_REF_NAME#v}"
      - name: Build release artifacts
        run: python -m build
      - name: Generate release notes
        run: python scripts/generate_release_notes.py --output release-notes.md
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssot-indexer-release
          path: |
            dist/*
            release-notes.md
            VERSION
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Docker images
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/ssot-indexer-orchestrator:${GITHUB_REF_NAME} -t ghcr.io/${{ github.repository_owner }}/ssot-indexer-orchestrator:${GITHUB_SHA} .
          docker build -t ghcr.io/${{ github.repository_owner }}/ssot-indexer-api:${GITHUB_REF_NAME} -t ghcr.io/${{ github.repository_owner }}/ssot-indexer-api:${GITHUB_SHA} .
          docker push ghcr.io/${{ github.repository_owner }}/ssot-indexer-orchestrator:${GITHUB_REF_NAME}
          docker push ghcr.io/${{ github.repository_owner }}/ssot-indexer-orchestrator:${GITHUB_SHA}
          docker push ghcr.io/${{ github.repository_owner }}/ssot-indexer-api:${GITHUB_REF_NAME}
          docker push ghcr.io/${{ github.repository_owner }}/ssot-indexer-api:${GITHUB_SHA}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/*
            release-notes.md
