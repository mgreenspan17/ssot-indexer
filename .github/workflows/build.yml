name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ssot-indexer-api:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ssot-indexer-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ssot-indexer-orchestrator:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ssot-indexer-orchestrator:${{ github.sha }}

